spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

security.jwt.secret=${JWT_SECRET:}
logging.pattern.correlation=[%X{requestId:-}]\u0020

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:OFF}
logging.level.org.hibernate.orm.jdbc.bind=OFF

igdb.api.base-url=https://api.igdb.com/v4
igdb.auth.token-url=https://id.twitch.tv/oauth2/token
igdb.client-id=${IGDB_CLIENT_ID:}
igdb.client-secret=${IGDB_CLIENT_SECRET:}
